markdown: >-
  # Awesome Math


  A curated, community-maintained “awesome list” of high-quality mathematics
  resources covering a wide range of branches and formats.


  **Website:** https://github.com/rossant/awesome-math


  ---


  ## Description


  Awesome Math is an open, categorized directory of freely available (with a few
  marked paid) mathematics resources. It aggregates books, lecture notes,
  videos, tutorials, tools, and more, organized by topic and resource type, to
  support learning and research across many areas of mathematics.


  ---


  ## Features


  - **Curated awesome list**
    - Manually curated collection of mathematics resources.
    - Part of the broader “Awesome” lists ecosystem.

  - **Free vs paid resources**
    - Most resources are freely available.
    - Paid resources are explicitly indicated with a 💲 icon.

  - **Content formats**
    - 📖 Books
    - 🎥 Videos
    - 📝 Lecture notes, slides, articles, and research papers

  - **General resources section**
    - Learning platforms
    - “Learn to learn” / learning strategies
    - YouTube series
    - Tools for doing or learning mathematics
    - Q&A sites and forums
    - Encyclopedias
    - Books and magazines
    - Blogs
    - Meetings and conferences
    - Miscellaneous math resources

  - **Branches of mathematics covered**
    - **Foundations of Mathematics**
      - Transition to pure/rigorous mathematics
      - Set theory
      - Logic
      - Category theory
      - Type theory
      - Homotopy type theory
      - Surreal numbers
    - **Number Theory**
      - Algebraic number theory
      - Analytic number theory
    - **Algebra**
      - Abstract algebra
      - Group theory
      - Linear algebra
      - Ring theory
      - Galois theory
      - Lie algebras
    - **Combinatorics**
      - Graph theory
    - **Geometry and Topology**
      - Differential geometry
      - Algebraic geometry
      - Algebraic statistics
      - Topology
      - Algebraic topology
    - **Analysis**
      - Real analysis
      - Harmonic analysis
      - Complex analysis
      - Functional analysis
      - Measure theory
      - Ordinary differential equations (ODEs)
      - Partial differential equations (PDEs)
      - Chaos theory
    - **Probability and Statistics**
      - Probability theory
      - Statistics
      - Statistical learning
      - Stochastic processes
    - Numerical analysis
    - Signal processing
    - Mathematics for computer science
    - Mathematical biology
    - Mathematical physics

  - **Students’ lecture notes**
    - Dedicated section collecting lecture notes created or compiled by students.

  - **Related awesome lists**
    - Links to other thematically related awesome lists for further exploration.

  - **Open license and reuse**
    - Released under CC0 (public domain dedication).
    - Copyright and neighboring rights waived by the maintainer, allowing broad reuse and adaptation.

  ---


  ## Pricing


  - Not a commercial product; the list itself is free to access.

  - Individual resources may be free or paid; paid items are marked with a 💲
  icon.


  ---


