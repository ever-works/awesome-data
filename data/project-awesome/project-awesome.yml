name: Project Awesome
description: This is a comprehensive searchable index aggregating thousands of
  GitHub Awesome lists across all topics. Key features include full-text search,
  topic browsing, star-ranked popularity, and direct repo links. Ideal for
  discovering themed curated open-source resources, as a dynamic alternative to
  the general sindresorhus/awesome.
