featured: true
markdown: >-
  ## Overview


  Project Awesome is a curated web directory and searchable index for GitHub
  awesome lists across all topics.


  ## Features


  - Full-text search

  - Category and topic browsing

  - Star count and popularity metrics

  - Direct links to repositories

  - User-friendly interface


  ## Use Cases


  - Discover themed awesome lists

  - Explore curated resources efficiently

  - Alternative interface to sindresorhus/awesome


  ## Pricing


  Free.
