name: Project Awesome
description: Project Awesome is a curated aggregator of awesome lists from
  GitHub, providing a searchable directory of themed awesome repositories. Key
  features include filtering by topic, star count, and updates, with dynamic
  tracking of list activity. It excels in discovering niche awesome lists
  quickly and compares to sindresorhus/awesome by focusing on aggregation and
  search over manual curation.
source_url: https://project-awesome.org
category: Meta Directories
tags:
