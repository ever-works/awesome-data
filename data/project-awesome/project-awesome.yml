name: Project Awesome
description: Project Awesome is a powerful searchable meta-directory indexing
  thousands of GitHub Awesome lists across every topic, with full-text search,
  topic browsing, star-ranked popularity tracking, and direct repository links.
  It facilitates rapid discovery of curated open-source resources by keyword or
  category. As a dynamic, user-friendly alternative to static general lists like
  sindresorhus/awesome or TrackAwesomeList, it enhances navigation and
  exploration.
source_url: https://project-awesome.org
