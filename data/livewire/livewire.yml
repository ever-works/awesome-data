name: Awesome Livewire
description: Awesome Livewire is the official, actively maintained
  project-specific awesome list for Livewire, a full-stack framework for Laravel
  to build reactive UIs without JavaScript. It curates packages, components, and
  resources enhancing reactivity in Laravel apps. Ideal for onboarding
  developers to the Livewire ecosystem, unlike general Laravel or frontend
  awesome lists.
source_url: https://github.com/livewire/awesome-livewire
category: Project Awesome Lists
tags:
  - project-awesome
  - official-list
  - ecosystem
featured: true
markdown: >-
  ## Overview


  Curated collection of packages and components for Livewire, a full-stack
  framework for Laravel.


  ## Topics Covered


  - Forms and tables

  - Utilities and components

  - Packages enhancing reactivity


  ## Use Cases


  - Real-time UIs in Laravel apps

  - No-JavaScript interactivity


  ## Comparisons


  Alternative to Hotwire or Inertia for PHP full-stack development.


  ## Pricing


  Free and open-source.
