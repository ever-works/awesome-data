name: Awesome Livewire
description: Awesome Livewire is the official project-specific awesome list for
  Livewire Laravel framework, curating packages, components, forms, tables, and
  utilities for reactive full-stack development. Key features include
  star-sorted sections enhancing reactivity. Ideal for onboarding to Livewire
  ecosystem, focused alternative to general PHP or Laravel awesome lists.
