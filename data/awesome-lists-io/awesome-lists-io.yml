name: Awesome Lists IO
description: Aggregates high-quality GitHub Awesome lists into a searchable
  index grouped by topics with star rankings and consistent formatting. Use for
  quick discovery of themed lists across multiple sources; more dynamic than
  individual static GitHub repos like sindresorhus/awesome.
  ![screenshot](https://raw.githubusercontent.com/awesomelistsio/awesome/main/media/logo.png)
