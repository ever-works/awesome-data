name: Awesome Lists IO
description: Compiles multiple high-quality GitHub awesome lists into a
  searchable index with topic grouping and dynamic star rankings updated to
  2026. Features consistent formatting, dead link detection, and active
  maintenance for reliable access. Facilitates quick discovery across aggregated
  lists versus the limited scope of single awesome repositories.
