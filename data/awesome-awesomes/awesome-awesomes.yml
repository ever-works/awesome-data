markdown: >-
  ## Overview


  Dynamically generated list of all "awesome" awesome lists, using a Ruby script
  for categorization by inception level.


  ## Aggregation


  Automatically indexes thousands of awesome lists by topic, stars, and
  inception depth.


  ## Features


  - Auto-updates via script

  - Star counts

  - Inception depth tracking


  ## Use Cases


  - Meta-exploration of awesome lists


  ## Comparisons


  | Feature | Awesome Awesomes | GitHub Search |

  |---------|------------------|---------------|

  | Exhaustiveness | All awesome lists | Partial |

  | Automation | Full | Manual |


  ## Pricing


  Free and open-source under the Apache 2.0 license.
