name: Awesome Awesomes
description: Comprehensive, automated index of GitHub awesome lists with
  categorization, search, star rankings (updated to 2026), daily tracking,
  broken link detection, and export features. Serves developers for rapid
  discovery of topic-specific awesome lists. More automated and searchable than
  sindresorhus/awesome, it focuses on aggregation with stats; contrasts
  ultimate-awesome by including maintenance metrics and duplication checks.
