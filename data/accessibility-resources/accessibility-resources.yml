name: Accessibility Resources
description: Accessibility Resources curates general software tools, guidelines
  like WCAG, and open-source projects focused on web accessibility and a11y best
  practices. It features categorized sections for easy browsing and leverages
  GitHub search for discovery. Ideal for developers seeking broad discovery of
  accessibility resources, providing a hand-curated directory versus dynamic,
  launch-focused platforms like Product Hunt.
