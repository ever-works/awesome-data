name: Accessibility Resources
description: Hand-curated GitHub directory of software tools, WCAG guidelines,
  and open-source projects for web accessibility and a11y best practices,
  organized into categories. Supports GitHub search and browser filters for
  discovery, with community-driven updates via pull requests. Ideal for
  developers discovering accessibility resources, as a focused curated list
  versus broad GitHub awesome collections.
