markdown: >-
  ## Overview


  StatsForecast provides a collection of robust, fast, and scalable statistical
  models for time series forecasting.


  ## Features


  - AutoStats: Automatic selection of the best model and configuration.

  - Supports exogenous regressors.

  - Cross-validation capabilities.

  - Plotting and prediction intervals.


  ## Pricing


  Free and open-source.
