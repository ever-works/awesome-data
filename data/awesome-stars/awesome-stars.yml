markdown: >-
  ## Overview


  A dynamic list of starred GitHub repositories, automatically generated and
  categorized by programming language (e.g., C with 61 repos, Go with 134).
  Includes high-star projects like Linux kernel (96k stars), Prometheus (32k
  stars), and TensorFlow (147k stars).


  ## Features


  - Language-based grouping (Assembly to Vue)

  - Tables with repo name, description, owner, and stars

  - Focus on popular tools, libraries, kernels, and frameworks


  ## Use Cases


  - Discover trending open-source projects

  - Reference for starred repos in specific languages


  ## Pricing


  Free and open-source.
