name: awesome-stars
description: Aggregates starred GitHub repositories into dynamically generated
  awesome-style lists grouped by programming languages, with auto-updates and
  star history. Features language-based categorization and real-time tracking
  for searchable indexes. Useful for quick discovery of popular repos across
  personal stars, unlike static single-topic awesome lists.
source_url: https://github.com/luphord/awesome-stars
category: Star-Ranked Awesome Indexes
tags:
  - aggregator
  - index
  - searchable-lists
  - ranked-lists
  - community-curated
markdown: >-
  ## Overview


  awesome-stars is an auto-generated list of GitHub repositories starred by user
  luphord, categorized by programming languages like Assembly, BitBake, C, C#,
  C++, Go, JavaScript, Python, and more.


  ## Features


  - Organized by language (e.g., Assembly, C, Go, JavaScript)

  - Generated using 'starred' tool

  - Covers diverse projects from bare metal examples to web servers, monitoring
  tools, and more


  ## Use Cases


  - Discover starred projects in specific languages

  - Personal bookmarking of open-source repositories


  ## Pricing


  Free and open-source.
