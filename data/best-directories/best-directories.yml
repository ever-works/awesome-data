markdown: |-
  ## Overview

  Meta-directory rating and organizing online directories by niches.

  ## Features

  - Ratings and comparisons
  - Category/tags exploration
  - Filtering/sorting
  - Trending highlights
  - Owner submissions
  - Newsletter updates

  ## Use Cases

  - Directory comparison
  - Niche discovery (AI, dev, finance)
  - Research and submission

  ## Comparisons

  | Feature | Best Directories | GitHub Awesome |
  |---------|------------------|----------------|
  | Ratings | Yes | Stars only |
  | Web focus | Yes | Repos |
  | Search | Advanced | Basic |

  ## Pricing

  Free.
