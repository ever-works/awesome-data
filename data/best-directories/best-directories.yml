name: Best Directories
description: BestDirectories.org aggregates and rates top online directories
  across niches as a comprehensive directory-of-directories with searchability
  and trending highlights. Features include ratings, category filtering/sorting,
  owner submissions, and regular updates. Suited for comparing directories,
  project research, and discovery; more dynamic and rated than plain static
  GitHub awesome lists.
