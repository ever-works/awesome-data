name: Awesome Search
description: Awesome Search is a comprehensive index and search engine for
  thousands of GitHub awesome lists, featuring full-text search, category/tag
  filtering, star rankings as of 2026, and real-time updates. Ideal for
  developers seeking topic-specific resources. More meta/focused than
  sindresorhus/awesome, this enables discovery across all lists.
