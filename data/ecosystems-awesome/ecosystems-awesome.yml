name: Ecosyste.ms Awesome
description: Ecosyste.ms Awesome is an analytics-driven meta-directory for
  exploring GitHub awesome lists, offering filtering by topic (e.g., web3,
  solidity), language, ecosystem metrics, dependencies, star tracking, and
  contributor statistics. It provides advanced features like topic clustering,
  trend analysis, and cross-list search for in-depth insights. Use cases include
  discovering and analyzing awesome lists by theme or language, far surpassing
  static alternatives like sindresorhus/awesome with data-rich visualizations.
source_url: https://awesome.ecosyste.ms
category: Meta Awesome Directories
tags:
  - meta-awesome
  - list-discovery
  - analytics
featured: true
markdown: >-
  ## Overview


  Ecosyste.ms Awesome is a comprehensive platform for exploring the awesome list
  ecosystem with rich metadata, analytics, and filtering capabilities.


  ## Key Features


  - Browse awesome lists by topic

  - Filter by programming language

  - Ecosystem metrics

  - Dependency information

  - GitHub analytics

  - Topic clustering


  ## Examples (2026)


  - awesome-web3 by topic

  - awesome-ethereum collections

  - awesome-solidity resources

  - awesome-rust by language=JavaScript filter


  ## Metrics Provided


  - GitHub stars and forks

  - List of projects

  - Language breakdown

  - Update frequency

  - Contributor statistics

  - Topic categorization


  ## Advanced Features


  - Cross-list search

  - Topic exploration

  - Language filtering

  - Trend analysis

  - Related lists


  ## Target Audience


  Developers and researchers wanting deep insights into awesome lists and their
  ecosystems.


  ## Pricing


  Free platform.
