markdown: >-
  ## Overview


  BetaPage auto-generates product directory pages upon submission for quick
  promotion and discovery.


  ## Features


  - Instant directory listing templates

  - Newsletter promotion (30k+ subs)

  - SEO-friendly public URLs

  - No approval delays

  - Analytics insights


  ## Use Cases


  - Rapidly build and launch custom startup directories

  - Promote MVPs to early adopters

  - SEO boost via indexed listings

  - Iterative updates during promotion cycle


  ## Comparisons


  **vs Manual Markdown**: Automated hosting, traffic, newsletters vs static
  GitHub pages.


  ## Pricing


  Free submissions.
