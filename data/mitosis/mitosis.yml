name: Awesome Mitosis
description: Awesome Mitosis is the actively maintained project-specific awesome
  list for Mitosis, a component library for writing once and deploying across
  frameworks. It lists components, targets, plugins, and guides for
  multi-framework UI portability. Suited for onboarding cross-framework
  developers, distinct from general React or component awesome lists.
