name: Awesome Benthos
description: Awesome Benthos is the official curated list for Benthos, a stream
  processor for data. It features categorized resources and integrations for
  building data pipelines and event processing workflows. It serves as a
  lightweight alternative to Apache Kafka Streams.
source_url: https://github.com/redpanda-data/awesome-benthos
category: Project Awesome Lists
tags:
