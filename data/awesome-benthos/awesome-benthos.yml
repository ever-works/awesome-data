name: Awesome Benthos
description: Awesome Benthos is the official, actively maintained
  project-specific awesome list for Benthos, a high-performance stream processor
  for data pipelines. It curates categorized resources, components,
  integrations, and examples tailored to Benthos. Ideal for onboarding
  developers to the Benthos ecosystem, unlike general stream processing or data
  engineering awesome lists.
