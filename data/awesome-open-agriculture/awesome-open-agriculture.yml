name: Awesome Open Agriculture
description: "Community-curated hub for open-source ag-tech: hardware (sensors,
  robots like FarmBot), software (FarmOS, OpenFarm), and designs for
  hydro/aquaponics, promoting transparent, customizable farming innovations.
  Covers monitoring, automation, data analysis for small-scale to research use.
  Use cases: urban gardening, sustainable farms, education; stands out from
  general IoT by agriculture-specific OSS hardware/software integration."
source_url: https://github.com/CommonGarden/awesome-open-ag
category: Open Source
