name: Hacker News
description: Influential tech community and discussion forum focused on
  startups, technology, and innovation, featuring daily curated top stories,
  Show HN product launches, and high-engagement threads with algorithmic ranking
  and comment searchability. Serves developers, founders, and tech professionals
  for news discovery, feedback on launches, and networking via influential
  YC-backed audience. Contrasts general directories by its real-time,
  merit-based conversation model over static lists.
source_url: https://news.ycombinator.com
category: Themed Directories
tags:
  - curated-topic
