markdown: |-
  ## Overview

  Metadata aggregator for Awesome lists.

  ## Features

  - Live star/topic dashboard
  - JSON index for queries

  ## Use Cases

  - Ecosystem maintenance
  - Resource discovery

  ## Comparisons to Static GitHub

  | Feature | Viewer | Static GitHub |
  |---------|--------|---------------|
  | Aggregation | Cross-list | Single |
  | Data | Enriched live | Basic |
  | Query | JSON | None |

  ## Pricing

  Free open-source.
