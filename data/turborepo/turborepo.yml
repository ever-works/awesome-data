name: Awesome Turborepo
description: Awesome Turborepo (also known as Awesome Turbo) is the official,
  actively maintained project-specific awesome list for Turborepo, a
  high-performance build system for monorepos. It aggregates libraries, tools,
  and tutorials in the Turborepo ecosystem. Ideal for onboarding developers to
  Turborepo, unlike general monorepo or build tool awesome lists.
