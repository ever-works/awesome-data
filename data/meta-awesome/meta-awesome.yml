name: Meta Awesome
description: Meta Awesome by Jepemo functions as an inception-level aggregator
  in the awesome ecosystem, categorizing hundreds of awesome lists by topics
  like security, programming, and AI. Features hierarchical organization,
  searchable navigation, and direct repo links. Use for directory-of-directories
  discovery of themed lists; offers deeper categorization compared to the flat,
  topic-based sindresorhus/awesome.
