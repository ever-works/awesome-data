name: Awesome Hacktoberfest
description: "Curated collection of beginner-friendly open-source repos, guides,
  and resources for Hacktoberfest participants to make first PRs, with tagged
  'good first issue' projects across languages. Facilitates October's
  open-source celebration by linking communities, tutorials, and event-specific
  lists. Use cases: new contributor onboarding, skill-building, community
  engagement; specialized vs general OSS lists by focusing on seasonal,
  low-barrier entry points."
