markdown: >-
  ## Overview


  Awesome-Awesome-LLMs is a lighthouse for the LLM ocean, indexing high-quality
  awesome lists with ratings, covering training, multimodal, agents, infra, and
  more.


  ## Key Features


  - **40+ Categories**: Pre-training, multimodal, agents, RAG, evaluation,
  security, etc.

  - **Quality Ratings**: ★★★★★ based on community value.

  - **Statistics**: 200+ lists, 500K+ stars, 10K+ papers.

  - **Use Cases**: Researchers (trending topics), Developers (infra/tools),
  Students (courses), Practitioners (prompts/eval).


  ## Pricing


  Free and open-source.
