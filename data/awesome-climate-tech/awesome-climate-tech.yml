name: Awesome Climate Tech
description: Curated ecosystem directory for climate technology, covering clean
  energy, carbon capture, sustainable transport, smart grids, agriculture, and
  finance initiatives from startups to research labs. Features categorized lists
  of technologies, companies, funding sources, and community resources to
  accelerate climate innovation. Use cases include scouting solutions for
  developers, investors seeking opportunities, and policymakers; broader than
  software-only lists by including hardware, policy, and market maps.
source_url: https://github.com/thomkrupa/awesome-climate-tech
category: Open Source
tags:
  - climate
  - sustainability
  - clean-tech
  - startups
markdown: >-
  ## Overview


  Comprehensive collection of climate tech resources spanning energy, transport,
  agriculture, buildings, and finance to combat climate change through
  technology.


  ## Key Categories


  - Clean Energy (solar, wind, nuclear, hydrogen)

  - Energy Storage (batteries, thermal)

  - Carbon Capture & Removal (DAC, biochar)

  - Smart Grids & VPPs

  - Sustainable Transport (EVs, aviation)

  - Industrial Decarbonization

  - Regenerative Agriculture

  - Climate Adaptation Tools

  - Finance & Investment

  - Data & Analytics

  - Circular Economy


  ## Use Cases


  - Innovation discovery

  - Investment research

  - Startup benchmarking

  - Policy development


  ## Pricing


  Free repository.
