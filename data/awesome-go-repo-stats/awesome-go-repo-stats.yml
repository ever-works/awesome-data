  ## Overview

  automated stats tracker for awesome-go repos.

  ## Features

  - Daily star/commit history
  - Dependency analysis
  - CSV/JSON exports

  ## Use Cases

  - Monitor list repo health
  - Trend analysis for maintenance

  ## Comparisons

  | Aspect | Tool | Manual |
  |--------|------|--------|
  | Updates | Daily | None |
  | Exports | Yes | No |

  ## Pricing

  Free open-source.
