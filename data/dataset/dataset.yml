  Dataset is a command line tool, Go package, shared library and Python package
  for working with JSON objects stored as collections in a file.


  ## Features


  - Command-line interface for data operations

  - Go and Python bindings

  - Supports JSON collections


  ## Pricing


  Free and open-source.
