markdown: |-
  ## Overview

  Curated links to themed awesome lists.

  ## Aggregation

  Groups various awesome repositories by theme.

  ## Features

  - Themed grouping
  - Direct GitHub links

  ## Use Cases

  - Meta-navigation to resources
  - Topic exploration

  ## Comparisons

  | Feature | mthcht/awesome-lists | GitHub Search |
  |---------|----------------------|---------------|
  | Focus | Awesome lists | All repos |
  | Grouping | Yes | No |

  ## Pricing

  Free.
