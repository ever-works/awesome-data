featured: true
markdown: >-
  ## Topics Covered


  - Client modules and libraries

  - Tools and command-line utilities

  - Applications and demos

  - Research and publications


  ## Use Cases


  - Decentralized data sharing and backups

  - Live-synced datasets for research


  ## Comparisons


  Project-specific scope unlike general decentralized storage awesome lists
  (e.g., Awesome IPFS); emphasizes Dat protocol ecosystem.


  ## Pricing


  Free and open-source.
