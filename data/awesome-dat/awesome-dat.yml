name: Awesome Dat
description: Curated GitHub list of Dat protocol resources covering client
  libraries (JS, Rust, Go), tools, apps, and research on decentralized data
  sharing and P2P syncing. Around 250 GitHub stars. Ideal for developers
  building collaborative data apps; more focused than broader P2P lists like
  Awesome IPFS.
source_url: https://github.com/datproject/awesome-dat
category: Featured Awesome Lists
