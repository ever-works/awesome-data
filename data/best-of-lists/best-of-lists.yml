name: Best-of Lists
description: Best-of Lists is a comprehensive index of GitHub awesome lists with
  data-driven rankings of open-source projects across topics, featuring
  categorization, star/contributor metrics, and weekly updates as of 2026. Ideal
  for developers seeking topic-specific resources. More meta/focused than
  sindresorhus/awesome, this uses quantitative curation.
