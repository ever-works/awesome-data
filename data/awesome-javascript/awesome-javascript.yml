name: Awesome JavaScript
description: A curated list of awesome JavaScript frameworks, libraries, and
  software, exemplifying the hierarchical structure of awesome lists with h2/h3
  headers for topics and bullet lists of links with descriptions. It uses
  GitHub's pull request system for moderated contributions.
