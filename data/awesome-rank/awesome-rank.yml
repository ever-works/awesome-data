name: Awesome Rank
description: "Awesome Rank ranks GitHub Awesome lists by metrics like stars,
  forks, activity, and freshness. It helps discover top-quality, actively
  maintained awesome lists across topics. Key features: sortable tables, trend
  graphs, daily updates; great for finding hidden gems. Unlike Track Awesome
  List's notifications, it emphasizes ranking and comparison."
source_url: https://awesomerank.github.io/
category: Awesome Discovery Tools
tags:
  - ranking
  - metrics
  - trends
  - sortable
markdown: |-
  ## Overview

  Tracks GitHub awesome lists with comprehensive rankings and analytics.

  ## Features

  - Daily star/fork/update tracking
  - Multi-metric rankings (stars, freshness, forks)
  - Trend graphs and historical data
  - Category-based browsing
  - Comparison tools

  ## Use Cases

  - Identify top/trending awesome lists
  - Monitor resource popularity over time
  - Research adoption of tools/categories

  ## Comparisons

  | Metric | Awesome Rank | Static Lists |
  |--------|--------------|--------------|
  | Stars  | Live tracking| Snapshot |
  | Trends | Graphs | None |
  | Ranks  | Computed | None |

  ## Pricing

  Free platform.
