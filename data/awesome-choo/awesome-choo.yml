markdown: >-
  # Awesome choo


  **URL:** https://github.com/choojs/awesome-choo#readme  

  **Category:** Themed directories  

  **Tags:** awesome-lists, javascript, web-development


  ## Description

  Awesome choo is a curated “awesome list” of resources, examples, and tools
  related to **choo**, a small (~4kb) front-end framework for building sturdy
  web applications.


  ## Features

  - Curated collection of resources specific to the **choo** framework

  - Covers official choo resources and documentation

  - Lists framework **dependencies** that choo glues together under the hood

  - **Demos** showcasing choo in action

  - **Community** links (community projects, discussions, and ecosystem entries)

  - **Plugins and addons** that extend or integrate with choo

  - **Elements** (UI components and related building blocks for choo apps)

  - **CLI templates** for `choo-cli`, plus additional CLI templates from the
  community

  - General **resources** categorized by type:
    - 🎥 videos
    - 💻 tutorials
    - 📖 articles
  - **Projects using choo** to see real-world usage examples

  - Open contribution model with documented guidelines (`CONTRIBUTING.md`)

  - Code of conduct for contributors (`CONDUCT.md`)

  - Licensed under **CC0** (public domain dedication)


  ## Pricing

  - Free, open-source resource list (CC0 license).
