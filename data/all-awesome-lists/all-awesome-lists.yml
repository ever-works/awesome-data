name: All Awesome Lists
description: This meta-directory aggregates thousands of GitHub Awesome lists
  using the official 'awesome' topic, featuring full-text search, sorting
  options by stars, forks, recency, and language filters with real-time GitHub
  data. Ideal for broad discovery of curated awesome collections and trend
  monitoring, unlike sindresorhus/awesome it provides an automated, exhaustive
  index across all topics instead of a manually maintained single list.
source_url: https://github.com/topics/awesome
