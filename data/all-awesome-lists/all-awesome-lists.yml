name: All Awesome Lists
description: All Awesome Lists, GitHub's official aggregation, indexes thousands
  of awesome lists as a searchable meta-directory in the awesome ecosystem. It
  provides inception-level aggregation with features like sorting by
  stars/forks/recency, language filters, and trend metrics. Ideal for
  directory-of-directories discovery and popularity tracking; more dynamic and
  metric-driven than static lists like sindresorhus/awesome.
source_url: https://github.com/topics/awesome
