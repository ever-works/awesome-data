markdown: >-
  ## Overview


  GitHub’s central aggregation of all public 'awesome' tagged repositories,
  serving as a searchable meta-directory of community-curated awesome lists.


  ## Features

  - Filters by language

  - Sorting by stars, forks, recency

  - Trend metrics


  ## Use Cases

  - Discover lists for curation and maintenance

  - Track trending collections


  ## Comparisons


  | Feature | All Awesome Lists | Manual |

  |---------|-------------------|--------|

  | Aggregation | Awesome-specific | None |

  | Metrics | Sortable | None |


  ## Pricing

  Free.
