  ## Meta Awesome – Integrated Development Environment

  **Website:** <https://github.com/jepemo/meta-awesome/blob/master/doc/integrated-development-environment.md>

  ### Overview
  Meta Awesome – Integrated Development Environment is a curated, Awesome-style directory focused specifically on Integrated Development Environments (IDEs). It is part of the broader Meta Awesome project and organizes links and resources related to IDEs, distinct from other generalized IDE pages.

  ### Category
  - Meta directories

  ### Tags
  - awesome-lists
  - ide
  - developer-tools

  ### Features
  - Curated in the "Awesome" list format
  - Dedicated page specifically for Integrated Development Environments
  - Positioned within the Meta Awesome collection of topic-focused directories
  - Distinct scope from other IDE-related pages in the Meta Awesome ecosystem
  - Uses GitHub-hosted markdown document for easy community contribution and maintenance

  ### Pricing
  - Not applicable (open GitHub-based directory/resource; no pricing information provided).
