description: "apd-core NaturalLanguage section indexes high-quality NLP datasets
  and lexical resources via YAML meta-files, acting as a meta-directory within
  Awesome Public Datasets. Key features: structured metadata, external links to
  resources like SQuAD and WordNet, integration with APD ecosystem. Use cases:
  discovering NLP datasets and corpora; more machine-readable than static GitHub
  awesome lists."
