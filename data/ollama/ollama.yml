featured: false
markdown: |-
  ## Overview

  Ollama allows users to run open LLMs like Llama 3.2 and Mistral locally.

  ## Features

  - Local execution of large language models
  - Support for multiple models including Llama 3.2 and Mistral
  - Command-line interface for easy management

  ## Pricing

  Free and open-source.
