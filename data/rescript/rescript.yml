name: Awesome ReScript
description: Awesome ReScript is the official, actively maintained
  project-specific awesome list for ReScript, a typed alternative to JavaScript.
  It aggregates libraries, tools, and tutorials in the ReScript ecosystem. Ideal
  for onboarding developers to ReScript, unlike general JavaScript or OCaml
  awesome lists.
source_url: https://github.com/rescript-association/awesome-rescript
