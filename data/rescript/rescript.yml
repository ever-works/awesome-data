featured: true
markdown: >-
  ## Overview

  Awesome resources for ReScript, a typed JavaScript alternative.


  ## Characteristics

  - Follows standard awesome list format: Markdown on GitHub with curated links
  and descriptions.

  - Part of the broader ecosystem of independently-managed awesome directories
  aggregated in meta lists.
