name: Awesome-Lists.net
description: Awesome-Lists.net is a searchable directory aggregating thousands
  of GitHub awesome lists by topic, stars, and activity. Features include
  filtering, sorting by stars/forks, and daily updates. Use for quick discovery
  of curated resources; compares to TrackAwesomeList by being a static
  searchable index vs dynamic tracker.
