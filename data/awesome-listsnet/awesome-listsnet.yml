name: Awesome-Lists.net
description: Awesome-Lists.net is a searchable web aggregator indexing thousands
  of GitHub awesome lists by topic, stars, forks, and activity. Features
  advanced filters, sorting options, daily updates, and RSS feeds. Use for
  meta-discovery and trend tracking; more dynamic and metric-driven than static
  GitHub searches.
