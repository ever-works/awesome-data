name: Awesome-Lists.net
description: Awesome-Lists.net is a dynamic searchable index of awesome lists
  with stats on stars, forks, and updates. It provides category filters,
  sortable dashboards, and efficient navigation for quick topic discovery. It
  outperforms GitHub search through awesome-specific categorization and live
  metrics.
