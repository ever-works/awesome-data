name: Awesome-Lists.net
description: Crawls and aggregates thousands of GitHub awesome lists into a
  searchable index, filterable by topic, stars, forks, and activity with daily
  updates. Features advanced sorting, trend tracking, and RSS feeds for grouped
  discovery. Enables rapid resource finding across vast lists, outperforming
  single-repo awesome lists in scale and dynamism.
source_url: https://awesome-lists.net
category: Awesome List Aggregators
tags:
  - aggregator
  - index
  - searchable-lists
markdown: >-
  ## Overview


  Awesome-Lists.net is a searchable directory aggregating thousands of GitHub
  awesome lists by topic, stars, and activity.


  ## Aggregation


  Indexes thousands of lists with topic and metric-based grouping.


  ## Features


  - Filtering by topic and other criteria

  - Sorting by stars, forks, activity

  - Daily updates


  ## Use Cases


  - Quick discovery of curated resources on specific topics


  ## Comparisons


  | Feature | Awesome-Lists.net | GitHub Search |

  |---------|-------------------|---------------|

  | Filters | Awesome-specific | General |

  | Updates | Daily | Real-time but unindexed |


  ## Pricing


  Free.
