featured: false
markdown: >-
  ## Overview


  classlayout.nvim visualizes memory layouts for C/C++ structs and classes in
  Neovim.


  ## Features


  - Displays field offsets, padding, alignment

  - Floating window visualization


  ## Pricing


  Free and open-source.
