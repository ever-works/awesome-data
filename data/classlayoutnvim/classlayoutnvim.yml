name: classlayout.nvim
description: Neovim plugin to visualize C/C++ struct and class memory layouts,
  showing field offsets, padding, and alignment in a floating window. Featured
  in Awesome Neovim under Programming Languages Support and Diagnostics. Useful
  for low-level C/C++ development and debugging memory structures.
source_url: https://github.com/J-Cowsert/classlayout.nvim
category: Development Tools
tags:
