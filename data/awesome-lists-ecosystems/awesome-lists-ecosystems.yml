name: Awesome Lists Ecosystems
description: Aggregates thousands of Awesome lists from GitHub, with search,
  filters by tags/categories/stars, and real-time star rankings. Use for quick
  discovery of themed lists and trend monitoring; more dynamic than static
  GitHub repos like sindresorhus/awesome.
