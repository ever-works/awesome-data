name: Awesome Lists Ecosystems
description: Dynamic aggregator that monitors hundreds of GitHub Awesome lists,
  tracking real-time stars, updates, rankings, and changes with search and
  filters. Key features include daily tracking, notifications, sorting by
  stars/tags/categories, RSS/API access. Ideal for list curators automating
  maintenance, project discovery, and trend monitoring versus static lists like
  sindresorhus/awesome.
source_url: https://awesome.ecosyste.ms/
