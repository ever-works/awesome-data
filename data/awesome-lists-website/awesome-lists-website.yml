name: Awesome Lists Website
description: Website for creating and sharing awesome lists, which are curated
  collections of links to resources on specific topics. Built using Phoenix
  framework in Elixir with Bootstrap 4.0 for the frontend. Developed by Ravern
  Koh as a pet project to learn photo uploads, email sending, and other
  features.
