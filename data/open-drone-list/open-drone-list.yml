name: Open Drone List
description: "OpenDroneList is the canonical directory of open source drone
  projects, aggregating curated GitHub repositories for hardware, software, and
  resources by topic. Features: categorized lists, community-maintained; use
  cases: discover drone ecosystem resources quickly; compared to single drone
  repos, it's a meta-hub for all open drones."
