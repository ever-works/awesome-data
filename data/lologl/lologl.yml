markdown: >-
  ## Overview


  List of Lists of GitHub Lists (LoLoGL), a meta-collection tracking other lists
  of GitHub lists in ascending order of first commit date, tribute to
  Wikipedia's List of lists of lists.


  ## Key Features


  - Dynamic aggregation of GitHub lists

  - Chronological ordering

  - GitHub-focused


  ## Use Cases


  - Inception-level discovery of awesome resources

  - Exploring interconnected lists


  ## Comparisons


  More specialized in list-of-lists than general directories.


  ## Pricing


  Free and open-source under CC0-1.0 license.
