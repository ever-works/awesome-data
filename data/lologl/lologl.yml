name: lologl
description: lologl (List of Lists of GitHub Lists) is a meta-collection
  tracking awesome lists and their sub-lists. It features recursive indexing of
  GitHub awesomes. Ideal for navigating inception-level metas; unique for depth
  in list hierarchies.
