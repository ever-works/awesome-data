name: Awesome Inertia.js
description: Awesome Inertia.js is the curated, actively maintained
  project-specific awesome list for Inertia.js, a framework for SPAs without
  building an API. It lists plugins, starters, adapters, and examples for
  Laravel, Vue, etc. Ideal for onboarding to the Inertia.js ecosystem, distinct
  from general frontend framework awesome lists.
source_url: https://github.com/innocenzi/awesome-inertiajs
