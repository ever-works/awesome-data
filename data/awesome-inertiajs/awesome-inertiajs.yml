name: Awesome Inertia.js
description: Awesome Inertia.js is the community-curated project-specific
  awesome list for Inertia.js, covering adapters, presets, packages, articles,
  and examples for SPA frameworks without APIs. Key features include sections
  for client/server adapters (Vue, React, Laravel, etc.) and starter kits. Ideal
  for onboarding to Inertia.js ecosystem, distinct from general frontend awesome
  lists.
