markdown: >-
  ## Overview


  Meta collection of awesome lists covering topics such as AI, DevOps,
  cybersecurity, blockchain, sustainability, and open governance.


  ## Features


  - Actively maintained repositories

  - Community contributions welcome

  - Structured by topics for easy discovery


  ## Pricing


  Free and open-source.
