name: Awesome (awesomelistsio)
description: "Awesome (awesomelistsio) is a meta-collection indexing hundreds of
  awesome lists on GitHub and beyond. It provides search, categorization, and
  updates for discovering themed directories. Key features: daily tracking, star
  rankings, RSS feeds. Use cases: researchers finding niche awesome lists;
  compare to sindresorhus/awesome for canonical list."
