name: Awesome (awesomelistsio)
description: Awesome (awesomelistsio) is a comprehensive index of GitHub awesome
  lists, featuring categorization, searchability, star rankings as of 2026, and
  daily tracking. Ideal for developers seeking topic-specific resources. More
  meta/focused than sindresorhus/awesome, this emphasizes comprehensive indexing
  of specialized lists.
