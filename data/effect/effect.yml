name: Awesome Effect
description: Awesome Effect is the official project-specific awesome list for
  Effect-TS, covering core libraries, patterns, examples, and integrations for
  functional programming in TypeScript. Key features include categorized
  ecosystem resources with robust community contributions. Ideal for onboarding
