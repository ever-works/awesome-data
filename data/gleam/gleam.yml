name: Awesome Gleam
description: Awesome Gleam is the official project-specific awesome list for
  Gleam language, curating packages, tools, learning materials, and community
  resources on the BEAM VM. Key features include community-maintained updates
  and categorized sections. Useful for Gleam developers onboarding to the
  ecosystem, more focused than general Elixir or BEAM awesome lists.
