markdown: >-
  ## Overview


  Early list of GitHub lists curated on Dec 29, 2013, serving as a foundational
  meta-collection.


  ## Key Features


  - Dynamic aggregation of GitHub lists

  - GitHub-focused


  ## Use Cases


  - Inception-level discovery of awesome resources

  - Exploring interconnected lists


  ## Comparisons


  More list-of-lists oriented than general directories.


  ## Pricing


  Free and open-source.
