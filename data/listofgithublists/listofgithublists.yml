name: ListOfGithubLists
description: ListOfGithubLists is an early meta-directory aggregating lists of
  GitHub lists for inception-level resource discovery. Features simple
  aggregation of interconnected awesome-style collections from 2013. Use for
  exploring nested list structures; more focused on list-of-lists than
  comprehensive directories like sindresorhus/awesome.
