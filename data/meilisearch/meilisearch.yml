name: Awesome Meilisearch
description: Awesome Meilisearch is the official, actively maintained
  project-specific awesome list for Meilisearch, an open-source search engine.
  It curates integrations, clients, UIs, guides, and resources for fast,
  typo-tolerant search. Ideal for onboarding to the Meilisearch ecosystem,
  unlike general search engine or Elasticsearch awesome lists.
