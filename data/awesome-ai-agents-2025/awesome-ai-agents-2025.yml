markdown: >-
  ## Overview


  Curated list focusing on AI agents ecosystem as of March 2026, highlighting
  production adoption stats (57% enterprises, 73% Fortune 500) and cutting-edge
  tools across frameworks, platforms, protocols, and more.


  ## Key Sections


  - **Agent Frameworks (Production-Ready)**: LangGraph, CrewAI, OpenAI Agents
  SDK, Microsoft AutoGen, LangChain, etc.

  - **Agent Platforms & Products**: Devin 2.0, Manus AI, OpenAI Deep Research,
  Replit Agent.

  - **Coding Agents**: Claude Code, Cursor, Aider, OpenHands.

  - **Protocols & Standards**: MCP (Model Context Protocol), A2A (Agent-to-Agent
  Protocol).

  - **Multi-Agent Patterns**: Orchestrator-Worker, Debate/Critique,
  Hierarchical.

  - **Agent Memory**: Mem0, Letta/MemGPT, Zep.

  - **Agent Observability**: Langfuse, LangSmith, AgentOps.

  - **Agent Security & Guardrails**: Guardrails AI, NeMo Guardrails.

  - **Voice Agents**: Retell AI, Vapi, Bland AI.

  - **Agent Deployment**: Modal, Replicate, E2B.

  - **RAG & Knowledge**: LlamaIndex, Haystack, vector DBs like Qdrant, Chroma.


