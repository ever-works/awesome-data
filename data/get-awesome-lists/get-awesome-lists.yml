name: Get Awesome Lists
description: Crawls and compiles thousands of GitHub awesome lists into a
  searchable index with filters for stars, topics, languages, rankings, and
  newsletters for dynamic updates. Features topic grouping and submission
  support for ongoing maintenance. Enables quick discovery across aggregated
  lists and trend monitoring, offering broader scope than single awesome
  repositories.
