name: Awesome Wails
description: Awesome Wails is the official, actively maintained project-specific
  awesome list for Wails, a framework for building desktop apps with Go and web
  tech. It curates resources, templates, and integrations for cross-platform
  development. Ideal for onboarding developers to Wails, unlike general Go or
  desktop app awesome lists.
