name: Track Awesome List
description: Track Awesome List is a dynamic tracker that monitors updates to
  sindresorhus/awesome and thousands of other awesome lists daily, providing RSS
  feeds, notifications, and an archive of changes. It features real-time update
  logs, search by date/list, and GitHub integration for maintainers tracking
  contributions and researchers monitoring trends. Unlike static meta-lists, it
  delivers live data.
