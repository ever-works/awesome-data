name: Track Awesome List
description: TrackAwesomeList (trackawesomelist/trackawesomelist) tracks over
  500 Awesome lists on GitHub, monitoring stars, updates, and activity. Key
  features include real-time dashboards, notifications, and JSON exports. Ideal
  for discovering trending Awesome lists and maintaining your own, it
  outperforms static meta-lists by providing dynamic metrics unlike
  sindresorhus/awesome.
source_url: https://www.trackawesomelist.com/
category: Awesome List Trackers
tags:
