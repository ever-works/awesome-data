name: Track Awesome List
description: "Track Awesome List monitors daily updates to GitHub awesome lists,
  notifying on additions/removals. Features RSS feeds, update history, and stats
  for thousands of lists. Ideal for staying current with open-source resources.
  Unlike static directories, it provides real-time tracking. Use cases: OSS
  maintainers, researchers."
source_url: https://www.trackawesomelist.com/
category: Awesome List Tools
tags:
