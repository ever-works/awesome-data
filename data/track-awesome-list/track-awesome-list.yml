name: Track Awesome List
description: "TrackAwesomeList monitors daily changes in GitHub awesome lists,
  providing stats, rankings, and notifications. Key features: star history
  charts, contributor stats, freshness scores. Use cases: discover active lists,
  track popularity; vs static directories, it's dynamic and real-time."
