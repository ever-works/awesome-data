name: Track Awesome List
description: Monitors daily updates and GitHub stars across 500+ Awesome lists,
  providing notifications via RSS/email, star history charts, search, and
  trending sections. Key features include real-time tracking, per-list feeds,
  timeline views, and sortable archives. Essential for list curators, project
  discovery, and staying current without manual checks, outperforming static
  lists like sindresorhus/awesome.
