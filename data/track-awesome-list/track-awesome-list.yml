name: Track Awesome List
description: "Dynamic aggregator and tracker curating updates from awesome lists
  across GitHub topics, acting as a live mega-list of changes. Key features:
  extensive stats and categorization by stars/freshness, community
  notifications, historical charts. Use cases: rapid discovery of new resources
  in any domain; vs static metas, offers broadest real-time scope and canonical
  tracking reference."
