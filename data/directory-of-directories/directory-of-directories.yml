name: Directory of Directories
description: Directory of Directories is a key inception-meta hub in the awesome
  ecosystem, indexing over 300 directories and awesome lists categorized by
  niches like AI and SaaS. Features star rankings, update tracking,
  search/filter, and submission tools for community growth. Essential as a
  directory-of-directories for discovery and promotion; encompasses broader web
  sources beyond GitHub, unlike the topic-focused sindresorhus/awesome.
source_url: https://github.com/dariubs/directory-of-directories
category: Meta Awesome Directories
tags:
  - inception-meta
  - directory-of-directories
  - meta-index
featured: true
markdown: >-
  ## Overview


  Curated meta-directory aggregating directories and lists from GitHub and web
  sources.


  ## Features


  - Categorized by niche (AI, SaaS, etc.)

  - Regular updates

  - Submission for new directories

  - Star tracking for GitHub items


  ## Use Cases


  - SEO and promotion discovery

  - Cross-topic directory exploration

  - Researching awesome lists


  ## Comparisons


  | Feature | Directory of Directories | GitHub Search |

  |---------|---------------------------|---------------|

  | Scope | Directories/lists/web | Repos |

  | Categories | Yes | Limited |

  | Curated | Yes | No |


  ## Pricing


  Free.
