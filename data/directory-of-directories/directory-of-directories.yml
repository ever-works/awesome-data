name: Directory of Directories
description: Directory of Directories curates over 300 directories and awesome
  lists across GitHub and web sources, categorized by niches like AI and SaaS.
  Features star rankings, update tracking, and submission options. Use for broad
  directory discovery and promotion; broader scope including non-GitHub sites
  compared to awesome-only lists.
