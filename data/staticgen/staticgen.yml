markdown: |-
  ## Overview
  Directory of static website generators with community-submitted data.

  ## Features
  - Popularity metrics (e.g., Twitter followers, GitHub stars).
  - Helps assess community robustness around software.
  - Contrasts with plain awesome lists by offering sortable, visual metadata.
