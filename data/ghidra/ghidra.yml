markdown: >-
  ## Overview


  Ghidra is a software reverse engineering (SRE) framework developed by the NSA
  Research Directorate. It includes features to allow software developers to
  analyze compiled code.


  ## Features


  - Disassembly

  - Decompilation

  - Graphing

  - Scripting support (Java, Python)

  - Multi-processor support


  ## Pricing


  Free and open-source under the Apache License 2.0.
