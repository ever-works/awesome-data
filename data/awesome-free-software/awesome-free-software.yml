name: Awesome Free Software
description: Curated list prioritizing free/libre open-source software that
  respects the four essential freedoms, privacy, and user control over
  proprietary alternatives in categories like OS, browsers, office suites, and
  media tools. Emphasizes ethical, auditable software without telemetry or
  lock-in for privacy-conscious users. Use cases include building
  freedom-respecting computing environments, learning from source, and avoiding
  surveillance; contrasts gratis-only lists by focusing on philosophical
  freedom.
source_url: https://github.com/johnjago/awesome-free-software
category: Open Source
tags:
  - free-software
  - open-source
  - privacy
  - foss
featured: false
markdown: >-
  ## Overview


  Collection of fully free (libre) software alternatives emphasizing user
  freedoms, privacy, and no proprietary dependencies.


  ## Features


  - Freedom-respecting apps

  - Cross-platform support

  - No tracking/telemetry

  - Community governance

  - Open standards


  ## Categories


  - OS (Linux distros)

  - Browsers (Firefox)

  - Productivity (LibreOffice)

  - Media (GIMP, Audacity)

  - Communication

  - Dev Tools


  ## Use Cases


  - Ethical computing

  - Privacy setups

  - Cost-free stacks


  ## Pricing


  Free as in freedom.
