name: awesome-awesome
description: In the awesome ecosystem, awesome-awesome functions as an
  inception-level meta-index aggregating lists of awesome lists, organized by
  topic with direct links to curated collections. Features inception-level
  aggregation, search/filter capabilities, and community updates. Use cases
  include serving as a directory of directories for broad discovery across the
  awesome landscape; unlike sindresorhus/awesome which is a single topic-based
  list, it provides higher-level navigation to multiple specialized lists.
