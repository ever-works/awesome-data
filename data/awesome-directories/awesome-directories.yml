name: Awesome Directories
description: Awesome Directories aggregates over 300 curated SaaS launch
  directories for indie hackers, featuring real-time search, filters by domain
  rating/category/pricing, community voting, favorites, and weekly updates. Key
  use cases include discovering submission platforms for product promotion and
  exporting lists. Outperforms static GitHub topics with specialized metrics and
  automation.
