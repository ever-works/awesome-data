name: Awesome Directories
description: Awesome Directories is a comprehensive meta-directory aggregating
  over 300 curated SaaS launch directories for indie hackers and bootstrappers.
  Key features include real-time search, filtering by domain rating, category,
  pricing, dofollow status, community voting, favorites, submission tracking,
  and weekly automated updates. Ideal for discovering and exporting submission
  platforms for product promotion, it provides specialized metrics beyond
  general collections like sindresorhus/awesome or TrackAwesomeList.
