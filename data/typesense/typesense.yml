name: Awesome Typesense
description: Awesome Typesense is the official, actively maintained
  project-specific awesome list for Typesense, a fast open-source search engine.
  It aggregates libraries, tools, and tutorials in the Typesense ecosystem.
  Ideal for onboarding developers to Typesense, unlike general search or
  Elasticsearch awesome lists.
