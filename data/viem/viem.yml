name: Awesome Viem
description: Awesome Viem is the official, actively maintained project-specific
  awesome list for Viem, a lightweight TypeScript Ethereum library. It
  aggregates libraries, tools, and tutorials in the Viem ecosystem. Ideal for
  onboarding developers to Viem, unlike general Ethereum or TypeScript awesome
  lists.
