name: jnv/lists
description: jnv/lists is a definitive meta-directory compiling lists of lists
  from GitHub and beyond, including awesome lists, open-source apps, APIs, and
  more. It provides categorized indexes like open-source Mac apps and static
  site generators. Ideal for discovering curated resources across topics, it
  compares to sindresorhus/awesome by being a list-of-lists hub.
