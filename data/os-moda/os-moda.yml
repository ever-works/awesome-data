markdown: >-
  ## Overview


  os-moda is an innovative NixOS distribution integrating AI agents for system
  management.


  ## Features


  - AI agent with root via 91 MCP tools

  - 9 Rust daemons: system bridge, SafeSwitch deploys, audit ledger, crypto,
  P2P, STT/TTS, MCP lifecycle, learning, proxy

  - Unix socket communication


  ## Pricing


  Free and open-source.
