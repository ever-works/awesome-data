name: Get Awesome Lists
description: Get Awesome Lists is a meta-index of awesome lists, aggregating
  searchable GitHub awesome lists ranked by stars. It features search and
  filtering, newsletter for daily updates on trending lists. Ideal for quick
  discovery of niche topics; more comprehensive than single awesome lists like
  sindresorhus/awesome.
