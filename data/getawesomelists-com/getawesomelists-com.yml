name: Get Awesome Lists
description: "Get Awesome Lists is a searchable directory of GitHub Awesome
  lists, allowing filtering by stars, topics, and languages. It indexes
  thousands of awesomes for quick discovery. Key features: advanced search,
  categorization, submission form; outperforms basic GitHub search. Compared to
  Awesome Rank, it focuses on searchability."
