markdown: >-
  ## Overview


  Get Awesome Lists is a dedicated directory and search engine for GitHub's
  awesome lists, emphasizing the most starred collections.


  ## Features


  - Search awesome lists

  - Rankings by GitHub stars

  - Newsletter updates

  - FAQs and guides


  ## Use Cases


  - Discover themed awesome lists

  - Track trending and new collections

  - Compare to sindresorhus/awesome


  ## Pricing


  Free.
