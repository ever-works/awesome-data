name: Trendshift
description: This is a dynamic meta index aggregating trending GitHub
  repositories with analytics, functioning as a real-time awesome lists
  discoverer. Key features include momentum tracking, language filtering, growth
  metrics, and topic search. Ideal for spotting emerging open-source gems before
  they hit traditional lists like sindresorhus/awesome.
