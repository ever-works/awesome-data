name: Trendshift
description: Trendshift is a real-time meta-directory monitoring trending GitHub
  repositories with advanced analytics like momentum scores, star growth
  tracking, language and topic filtering, and developer rankings. It enables
  discovery of emerging projects through historical trends, comparisons, and
  alerts before they gain traction in awesome lists. Superior for proactive
  project hunting compared to static directories like sindresorhus/awesome or
  TrackAwesomeList.
source_url: https://trendshift.io/
category: Meta Awesome Directories
