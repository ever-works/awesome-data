name: AlternativeTo
description: Crowdsourced software recommendation platform that functions as a
  directory generator for alternatives, allowing users to build and promote
  custom comparison lists. Features include templates for listings,
  SEO-optimized pages, and community-driven content vs manual Markdown curation.
