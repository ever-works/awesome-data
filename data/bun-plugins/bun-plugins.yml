name: Awesome Bun
description: Awesome Bun (apvarun) is a community-curated project-specific
  awesome list for Bun runtime, focusing on plugins, loaders, benchmarks, tools,
  and integrations. Key features include categorized resources and performance
  comparisons. Useful for onboarding to Bun ecosystem, more Bun-centric than
  general JavaScript runtime awesome lists.
