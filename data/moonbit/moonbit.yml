name: Awesome Moonbit
description: Awesome Moonbit is the official, actively maintained
  project-specific awesome list for Moonbit, a Rust-like language targeting
  WASM/JS/native. It curates libraries, tools, and examples for full-stack
  development. Ideal for onboarding Moonbit adopters, narrower than general Rust
  or WASM awesome lists.
