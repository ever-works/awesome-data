name: Awesome Biology
description: Curated meta-directory of open-source biology resources, including
  databases like NCBI and UniProt, sequence analysis tools, phylogenetics
  software, microscopy image processors, and educational courses. Aggregates
  tools for molecular biology, ecology, evolution, and computational biology,
  enabling researchers and students to discover vetted, freely accessible
  software and data. Ideal for bioinformatics workflows, academic research, and
  self-study; specialized alternative to general science awesome lists.
