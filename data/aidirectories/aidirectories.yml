name: aidirectori.es
description: aidirectori.es is a curated index of AI directories and GitHub
  awesome lists, serving as a meta-directory for discovering specialized AI
  resources and themed awesome repositories. Key features include topic
  categorization, search functionality, star rankings, and regular updates for
  dynamic relevance. Ideal for developers exploring AI-themed repos; more
  inception-level meta than sindresorhus/awesome, aggregating multiple curated
  sources.
