name: Awesome Green Software
description: "Curated directory of tools, principles, and best practices for
  sustainable software engineering, focusing on energy efficiency, carbon-aware
  computing, and reduced emissions via measurement tools like Cloud Carbon
  Footprint and optimization frameworks. Supports developers in building
  eco-friendly apps through hardware efficiency, CI/CD greening, and SCI
  metrics. Use cases: green DevOps pipelines, cloud optimization, ethical
  software design; differentiates from general sustainability lists by targeting
  code-level impact."
source_url: https://github.com/Green-Software-Foundation/awesome-green-software
category: Open Source
tags:
