markdown: >-
  ## Overview


  Resources for green software development minimizing environmental impact
  through efficient code, carbon scheduling, and measurement.


  ## Features


  - Energy profiling tools

  - Carbon metrics (SCI)

  - Optimization guides (frontend/backend/DevOps)

  - Standards and certifications


  ## Use Cases


  - Sustainable app development

  - Cloud cost/emission reduction

  - Green CI/CD


  ## Pricing


  Free and open-source.
