markdown: >-
  # gh-stars


  ## Overview


  gh-stars is a dynamically generated, awesome-list–style directory based on the
  GitHub stars of the user sokai. It aggregates and organizes starred
  repositories into a curated collection, making it easier to browse and
  discover noteworthy projects.


  ## Features


  - Auto-updated list

  - Awesome-list style organization

  - Derived from GitHub stars

  - Curated discovery


  ## Use Cases


  - Discovering starred repos in awesome format


  ## Pricing


  Free and open-source.
