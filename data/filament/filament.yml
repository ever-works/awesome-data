name: Awesome Filament
description: Awesome Filament is the official community-curated project-specific
  awesome list for Filament, covering plugins, packages, themes, forms, and
  tables for Laravel admin panels. Key features include star-sorted categorized
  sections and regular updates. Perfect for developers onboarding to Filament
  TALL stack, more focused than general Laravel awesome lists.
