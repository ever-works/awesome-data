name: Brandon Himpfen Awesome Lists
description: "Brandon Himpfen's Awesome Lists is a curated directory aggregating
  hundreds of GitHub Awesome lists by topic. It provides categorized browsing
  and search for easy discovery of specialized resources. Key features:
  topic-based grouping, star counts, direct links; useful for meta-navigation.
  Compares to sindresorhus/awesome by being more aggregator-focused."
