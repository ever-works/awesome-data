markdown: >-
  ## Overview


  Elasticsearch is a distributed, RESTful search and analytics engine capable of
  solving a growing number of use cases. It provides a distributed,
  multitenant-capable full-text search engine with an HTTP web interface and
  schema-free JSON documents.


  ## Features


  - Distributed search engine

  - Near real-time search

  - RESTful interface

  - Multi-tenancy

  - Full-text search

  - Percolator for reverse search


  ## Pricing


  Free and open-source under the Elastic License or Server Side Public License.
