name: Awesome All
description: "Awesome All compiles awesome lists across frameworks, libraries,
  and software into a categorized meta-directory. Key features: organized
  aggregation, star-ranked links, multi-domain coverage. Use cases: developer
  discovery of diverse curations; broader aggregation than single lists like
  sindresorhus/awesome."
