name: Top AI Directories
description: Top AI Directories is a curated meta-list of leading AI tool
  directories, enabling discovery and submission of AI products as a
  directory-of-directories. Features community contributions, organized
  listings, and GitHub hosting for updates. Ideal for AI developers promoting
  tools or researching directories; contrasts static GitHub lists by
  specifically aggregating AI directory sites.
source_url: https://github.com/best-of-ai/ai-directories
category: Meta Awesome Directories
tags:
  - meta-index
  - list-aggregator
  - ai-tools
  - github
markdown: |-
  ## Overview

  Curated list of top AI tool directories for discovery and submissions.

  ## Features

  - Community-driven additions
  - Organized by directory name
  - GitHub-hosted updates
  - Submission-friendly

  ## Use Cases

  - AI product promotion
  - Directory research
  - AI resource discovery

  ## Comparisons

  | Feature | Top AI Directories | General Awesome Lists |
  |---------|--------------------|-----------------------|
  | Scope | AI directories | Mixed projects |
  | Submission | Yes | Varies |
  | Focus | Meta AI | Broad |

  ## Pricing

  Free and open-source.
