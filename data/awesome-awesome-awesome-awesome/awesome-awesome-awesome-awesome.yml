markdown: >-
  ## Overview


  awesome-awesome-awesome-awesome is a curated, multi-level meta-list
  aggregating awesome lists that themselves curate other awesome lists, created
  by Sindre Sorhus.


  ## Features


  - Nested curation of high-quality meta-lists

  - Direct links to README files for easy navigation


  ## Use Cases


  - Discovering directories of directories

  - Meta-research on the GitHub awesome ecosystem


  ## Pricing


  Free and open-source.
