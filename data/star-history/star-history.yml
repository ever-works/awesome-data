markdown: >-
  ## Overview


  Star History provides visualizations of GitHub repository star growth over
  time.


  ## Features


  - Compare star histories across multiple repositories

  - Interactive star maps

  - Leaderboards ranking repositories by star gains (e.g., top weekly gainers)

  - Specialized leaderboards like Coding AI Leaderboard

  - Chrome extension for easy access


  Weekly updates highlight trending repositories based on star increases.
