name: list-of-lists
description: List-of-Lists is a curated meta-directory that aggregates hundreds
  of GitHub awesome lists and directory repositories across diverse topics
  including programming, tools, and domains. Key features include simple
  categorization for quick browsing and regular updates to keep the collection
  current. Ideal for discovering themed awesome lists, it offers a concise index
  compared to broader platforms like GitHub topics or sindresorhus/awesome.
