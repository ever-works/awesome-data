name: Awesome Coffee
description: A comprehensive meta-collection of productivity resources and
  curated lists for tech professionals, aggregating GitHub repositories,
  articles, tools, and guides for easy discovery. Key features include
  categorized sections, searchable content, and regular updates. Ideal for
  researching awesome productivity projects and finding workflow alternatives;
  more niche than broad collections like sindresorhus/awesome.
