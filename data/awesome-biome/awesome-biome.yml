name: Awesome Biome
description: Awesome Biome is the official project-specific awesome list for
  Biome, curating plugins, extensions, IDE integrations, guides, and tutorials
  for the fast toolchain. Key features include star-ranked sections and active
  maintenance. Perfect for developer onboarding to Biome and plugin discovery,
  hyper-focused vs general JavaScript tool lists.
source_url: https://github.com/biomejs/awesome-biome
category: Project Awesome Lists
tags:
  - project-specific
  - official-curated
  - linting
featured: true
markdown: |-
  ## Topics Covered

  - Plugins and extensions
  - Integrations with editors/IDEs
  - Guides and tutorials

  ## Use Cases

  - Web project linting/formatting
  - Toolchain optimization

  ## Comparisons

  Biome-specific, unlike broad Awesome JavaScript.

  ## Pricing

  Free and open-source.
