name: Awesome Biome
description: Awesome Biome is the curated GitHub list for Biome, a fast JS/TS
  linter and formatter written in Rust. It features plugins, integrations,
  guides, and resources for the web toolchain. Ideal for developers optimizing
  linting and formatting; narrower and more focused than general Awesome
  JavaScript or Rust tooling lists.
source_url: https://github.com/biomejs/awesome-biome
category: Project Awesome Lists
tags:
  - linter
  - formatter
  - javascript
featured: true
markdown: |-
  ## Topics Covered

  - Plugins and extensions
  - Integrations with editors/IDEs
  - Guides and tutorials

  ## Use Cases

  - Web project linting/formatting
  - Toolchain optimization

  ## Comparisons

  Biome-specific, unlike broad Awesome JavaScript.

  ## Pricing

  Free and open-source.
