name: Awesome Biome
description: Awesome Biome is the official, actively maintained project-specific
  awesome list for Biome, a fast JS/TS linter and formatter in Rust. It features
  plugins, integrations, guides, and resources for the Biome toolchain. Perfect
  for onboarding to the Biome ecosystem, narrower than general Awesome
  JavaScript or Rust tooling lists.
source_url: https://github.com/biomejs/awesome-biome
category: Project Awesome Lists
tags:
  - project-awesome
  - official-list
  - ecosystem
featured: true
markdown: |-
  ## Topics Covered

  - Plugins and extensions
  - Integrations with editors/IDEs
  - Guides and tutorials

  ## Use Cases

  - Web project linting/formatting
  - Toolchain optimization

  ## Comparisons

  Biome-specific, unlike broad Awesome JavaScript.

  ## Pricing

  Free and open-source.
