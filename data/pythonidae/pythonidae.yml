name: pythonidae
description: A comprehensive index of curated lists and resources for Python
  scientific programming, aggregating GitHub repositories for easy discovery in
  scientific computing and data science. Key features include categorized,
  searchable collections and regular updates. Ideal for researching Python
  scientific projects and finding alternatives; more niche than
  sindresorhus/awesome.
