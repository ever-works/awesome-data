name: ever-works/awesome
description: Curates a meta-collection of awesome directories and lists,
  mirroring dir.works with details on PaaS, entities, and official links. Key
  features include deep categorization, starred repositories, and
  community-driven updates as of 2026. Ideal for quick resource discovery and
  learning paths in directory ecosystems; more niche and directory-focused
  compared to general collections like sindresorhus/awesome.
